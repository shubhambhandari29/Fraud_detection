[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-backend"
version = "0.1.0"
description = "FastAPI backend for the Fraud Detection application"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
